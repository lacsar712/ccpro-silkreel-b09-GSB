services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: silkreel
      POSTGRES_USER: silkreel
      POSTGRES_PASSWORD: silkreel
    ports:
      - "6530:5432"
    volumes:
      - silkreel_5130_9130_6530_pg:/var/lib/postgresql/data
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U silkreel -d silkreel"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 30
    #   start_period: 40s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://silkreel:silkreel@db:5432/silkreel
      JWT_SECRET: silkreel-dev-secret
    ports:
      - "9130:8760"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5130:80"
    depends_on:
      - backend

volumes:
  silkreel_5130_9130_6530_pg:
